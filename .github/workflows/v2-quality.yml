name: V2 Quality and cPanel Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "php-backend/**"
      - "database/**"
      - "scripts/**"
      - "docs/v2/**"
      - ".github/workflows/v2-quality.yml"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.*"

permissions:
  contents: read

# Never cancel a running validation because a later documentation or code
# commit arrives. Runs are serialized per branch instead.
concurrency:
  group: v2-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: V2 checks and cPanel package
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, json, mbstring, pdo, pdo_mysql
          coverage: none
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: PHP syntax
        run: find php-backend -type f -name "*.php" -print0 | xargs -0 -r -n1 php -l
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build and audit cPanel package
        run: npm run build:cpanel
      - name: Upload cPanel package
        uses: actions/upload-artifact@v4
        with:
          name: 3food-pos-v2-cpanel-${{ github.sha }}
          path: |
            3food-pos-v2-update.zip
            3food-pos-cpanel.zip
          if-no-files-found: warn
          retention-days: 14
