# Registered on the default branch so pushes to this V2 branch can trigger it.
name: V2 cPanel deployment package

on:
  workflow_dispatch:
  push:
    branches:
      - feature/3food-pos-next-release-v2
    paths:
      - ".github/workflows/v2-cpanel-package.yml"
      - "src/**"
      - "php-backend/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.*"

permissions:
  contents: read

jobs:
  package:
    name: Build cPanel ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and package cPanel deployment
        run: npm run build:cpanel
      - name: Upload cPanel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: 3food-pos-v2-cpanel
          path: 3food-pos-v2-update.zip
          if-no-files-found: error
          retention-days: 14
