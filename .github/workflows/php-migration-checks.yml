name: PHP migration checks

on:
  push:
    branches:
      - migration/php-mysql
  pull_request:
    branches:
      - migration/php-mysql

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: PHP syntax
        run: php -l php-backend/public/api/index.php
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: >-
          node --experimental-strip-types --test
          src/lib/app-data/app-data.test.ts
          src/lib/app-data/readiness-schedule.test.ts
          src/lib/auth/gate-identity.test.ts
          src/lib/auth/sign-in-gate.test.ts
          src/lib/preview-path-prefix.test.ts
      - name: Lint
        run: npm run lint

      - name: Persist synchronized npm lockfile
        if: success()
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
